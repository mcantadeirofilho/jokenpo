<!DOCTYPE html>
<html lang="pt-br">

<head>
    <script src="scripts.js" defer></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>PROJETO JO-KEN-PO</title>
</head>

<body>
    <main></main>
    <div class="container">
        <h1> JO-KEN-PÔ</h1>
        <h2>Escolha sua jogada:</h2>
        <div class="buttons">
            <button id="jo" onclick="playHuman('rock')">&#x1FAA8;</button>
            <button id="ken" onclick="playHuman('paper')">&#x1F4DC;</button>
            <button id="po" onclick="playHuman('scissors')">&#x2702;</button>
        </div>
        <p class="result"> </p>
        <div>
            <h3 class="your-score">Sua Pontuação é: <span class="human-score"> 0 </span> </h3>
            <h3 class="machine-score">Pontuação da Alexa: <span class="alexa-score"> 0 </span> </h3>
        </div>
        <div class="overlay" id="meuPopup" style="display: none;">
            <div class="popup-box">
                <p>Você deseja jogar novamente??</p>
                <div class="botoes-container">
                    <button class="btn-sim" onclick="acaoSim()">Sim</button>
                    <button class="btn-nao" onclick="acaoNao()">Não</button>
                </div>
            </div>
        </div>

</body>

</html>
